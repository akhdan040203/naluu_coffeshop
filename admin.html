<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nalu Coffee - Admin Panel</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1" />
    <style>
        :root {
            --green: #064E3B;
            --orange: #fb923c;
            --cream: #F4F0EB;
            --danger: #EF4444;
            --text: #111827;
            --gray: #9CA3AF;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--cream);
            color: var(--text);
            line-height: 1.5;
            overflow-x: hidden;
        }

        .hidden { display: none !important; }

        /* --- UI COMPONENTS --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            gap: 8px;
        }

        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-primary { background: var(--green); color: var(--white); }
        .btn-orange { background: var(--orange); color: var(--white); }
        .btn-danger { background: var(--danger); color: var(--white); }
        .btn-edit { background: #3B82F6; color: var(--white); }
        .btn-ghost { background: rgba(255,255,255,0.1); color: var(--white); }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #E5E7EB;
            border-radius: 12px;
            font-size: 14px;
            background: #FAFAFA;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--green);
            background: var(--white);
        }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #374151;
        }

        /* --- LOADING --- */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--cream);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(6, 78, 59, 0.1);
            border-top-color: var(--green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- LOGIN --- */
        #login-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--green) 0%, #0a7c5f 100%);
            padding: 24px;
        }

        .login-box {
            background: var(--white);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        /* --- ADMIN LAYOUT --- */
        .admin-topbar {
            background: var(--green);
            color: var(--white);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .admin-content {
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- STATS --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--white);
            padding: 24px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .stat-value { font-size: 32px; font-weight: 800; color: var(--green); }
        .stat-label { color: var(--gray); font-size: 14px; font-weight: 600; }

        /* --- DASHBOARD GRID --- */
        .dashboard-main {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 24px;
            align-items: start;
        }

        .panel-card {
            background: var(--white);
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .panel-card h2 {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--green);
        }

        /* --- TABLE --- */
        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #F3F4F6;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th {
            background: #F9FAFB;
            padding: 14px 16px;
            text-align: left;
            font-size: 12px;
            font-weight: 700;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #F3F4F6;
            font-size: 14px;
            vertical-align: middle;
        }

        .cat-badge {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #F0FDF4;
            color: var(--green);
        }

        .cat-badge.food { background: #FFF7ED; color: var(--orange); }

        .action-btns {
            display: flex;
            gap: 8px;
            flex-wrap: nowrap;
        }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-box {
            background: var(--white);
            border-radius: 24px;
            padding: 32px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        /* --- RESPONSIVE BREAKPOINTS --- */
        @media (max-width: 1100px) {
            .dashboard-main { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .admin-topbar { padding: 12px 16px; }
            .admin-topbar h1 { font-size: 16px; }
            .admin-content { padding: 12px; width: 100%; max-width: 100vw; }
            .stats-grid { grid-template-columns: 1fr; gap: 12px; }
            .stat-card { padding: 16px; }
            .panel-card { padding: 16px; border-radius: 16px; width: 100%; max-width: 100%; overflow: hidden; }
            
            .inner-form-grid { grid-template-columns: 1fr !important; gap: 0 !important; }
            
            #add-category-form { flex-direction: column; width: 100%; }
            #add-category-form input { width: 100%; }
            #add-category-form button { width: 100%; margin-top: 8px; }
            
            td, th { padding: 12px 8px; font-size: 13px; }
            
            .btn { padding: 10px 16px; font-size: 13px; width: auto; max-width: 100%; }
            #btn-save { width: 100%; }
            
            .table-container { 
                margin: 0 -8px; 
                width: calc(100% + 16px); 
                border-radius: 0;
            }
            table { min-width: 500px; }
            
            .action-btns { gap: 4px; }
            .btn-edit, .btn-danger { min-width: 50px; font-size: 11px; padding: 6px 8px; }
        }

        @media (max-width: 480px) {
            .admin-topbar h1 { font-size: 14px; }
            .action-btns { gap: 4px; }
            .btn-edit, .btn-danger { min-width: 55px; }
            .stat-value { font-size: 26px; }
        }
    </style>
</head>

<body>

    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p style="margin-top: 15px; font-weight: 700; color: var(--green); font-size: 14px;">Memverifikasi akses...</p>
    </div>

    <!-- LOGIN -->
    <div id="login-section" class="hidden">
        <div class="login-box">
            <h1 style="color: var(--green); font-weight: 800; font-size: 28px; margin-bottom: 8px;">🔒 Nalu Admin</h1>
            <p style="color: var(--gray); font-size: 14px; margin-bottom: 30px;">Masukkan kunci akses untuk mengelola menu.</p>
            <form id="login-form">
                <div class="form-group">
                    <label>Email Akses</label>
                    <input type="email" id="email" class="input-field" required placeholder="admin@nalu.com">
                </div>
                <div class="form-group">
                    <label>Sandi Rahasia</label>
                    <input type="password" id="password" class="input-field" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">MASUK BRANKAS</button>
            </form>
            <p id="login-error" style="color: var(--danger); font-size: 13px; margin-top: 16px; display: none;"></p>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-section" class="hidden">
        <div class="admin-topbar">
            <h1>☕ Nalu Control Panel</h1>
            <button id="logout-btn" class="btn btn-ghost">Keluar</button>
        </div>

        <div class="admin-content">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div>
                        <div class="stat-value" id="stat-total">0</div>
                        <div class="stat-label">Total Menu</div>
                    </div>
                    <span class="material-symbols-outlined" style="font-size: 40px; color: #E5E7EB;">restaurant_menu</span>
                </div>
                <div class="stat-card">
                    <div>
                        <div class="stat-value" id="stat-coffee">0</div>
                        <div class="stat-label">Drink</div>
                    </div>
                    <span class="material-symbols-outlined" style="font-size: 40px; color: #E5E7EB;">coffee</span>
                </div>
                <div class="stat-card">
                    <div>
                        <div class="stat-value" id="stat-food">0</div>
                        <div class="stat-label">Eat</div>
                    </div>
                    <span class="material-symbols-outlined" style="font-size: 40px; color: #E5E7EB;">lunch_dining</span>
                </div>
            </div>

            <div class="dashboard-main">
                <!-- ADD MENU FORM -->
                <div class="panel-card">
                    <h2><span class="material-symbols-outlined">add_circle</span> Tambah Menu</h2>
                    <form id="add-menu-form">
                        <div class="form-group">
                            <label>Nama Menu</label>
                            <input type="text" id="m-name" class="input-field" required placeholder="Contoh: Kopi Susu Aren">
                        </div>
                        <div class="form-group">
                            <label>Harga</label>
                            <input type="text" id="m-price" class="input-field" required placeholder="Rp 22.000">
                        </div>
                        <div class="form-group">
                            <label>Deskripsi Singkat</label>
                            <input type="text" id="m-desc" class="input-field" placeholder="Contoh: Espresso with fresh milk">
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;" class="inner-form-grid">
                            <div class="form-group">
                                <label>Tab Filter</label>
                                <select id="m-category" class="input-field" required>
                                    <option value="coffee">☕ Drink</option>
                                    <option value="food">🍽️ Eat</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Kolom Full Menu</label>
                                <select id="m-full-category" class="input-field category-dropdown" required>
                                    <!-- Dynamic -->
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;" id="btn-save">SIMPAN KE DATABASE</button>
                    </form>

                    <div style="margin-top: 32px; border-top: 1px solid #F3F4F6; padding-top: 24px;">
                        <h2 style="font-size: 16px;"><span class="material-symbols-outlined">category</span> Kelola Kategori</h2>
                        <form id="add-category-form" style="display: flex; gap: 8px; margin-top: 12px;">
                            <input type="text" id="new-cat-name" class="input-field" placeholder="Kategori Baru" required>
                            <button type="submit" class="btn btn-primary">Tambah</button>
                        </form>
                        <div id="category-list" style="margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px;">
                            <!-- Category tags -->
                        </div>
                    </div>
                </div>

                <!-- TABLE SECTION -->
                <div class="panel-card" style="overflow: hidden;">
                    <h2><span class="material-symbols-outlined">list_alt</span> Live Menu</h2>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Menu</th>
                                    <th>Harga</th>
                                    <th>Kategori</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="menu-table-body">
                                <tr>
                                    <td colspan="4" style="text-align: center; padding: 48px; color: var(--gray);">Memuat data...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- EDIT MODAL -->
    <div id="edit-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>✏️ Edit Menu</h2>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label>Nama Menu</label>
                    <input type="text" id="edit-name" class="input-field" required>
                </div>
                <div class="form-group">
                    <label>Harga</label>
                    <input type="text" id="edit-price" class="input-field" required>
                </div>
                <div class="form-group">
                    <label>Deskripsi Singkat</label>
                    <input type="text" id="edit-desc" class="input-field">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;" class="inner-form-grid">
                    <div class="form-group">
                        <label>Tab Kategori</label>
                        <select id="edit-category" class="input-field" required>
                            <option value="coffee">☕ Drink</option>
                            <option value="food">🍽️ Eat</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Kolom Full Menu</label>
                        <select id="edit-full-category" class="input-field category-dropdown" required>
                            <!-- Dynamic -->
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="button" class="btn" id="cancel-edit" style="background: #E5E7EB; color: #374151; flex: 1;">Batal</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="/src/admin.js"></script>
</body>

</html>
